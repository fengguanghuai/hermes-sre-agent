[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-sre-agent"
version = "0.1.0"
description = "Policy-driven Kubernetes service diagnosis and bounded self-healing agent with Hermes Agent Skill integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
hermes-sre = "hermes_sre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
